name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# rust-cache.yml builds with the same settings, or its cache would serve nothing. No debug info
# keeps the build directory small enough to cache and links faster.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1

      # The pinned nightly and its components, from rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      # The cache comes from main (rust-cache.yml); a pull request's own would only serve that
      # pull request and crowd main's out.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false

      # The tests that need EVE data skip without it, so fetch the dump once per deimos release.
      - name: Find the deimos release
        id: deimos
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/NicolasKion/deimos/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Restore EVE data
        id: data
        uses: actions/cache@v4
        with:
          path: data/eve
          key: deimos-${{ steps.deimos.outputs.tag }}

      - name: Fetch EVE data
        if: steps.data.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-data.sh

      - name: Test
        run: cargo test --all-targets

  # GPUI compiles different code per OS. The EVE data is left out here; its tests skip.
  platforms:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false

      - name: Test
        run: cargo test --all-targets
