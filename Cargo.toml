[package]
name = "efa"
version = "0.1.8"
edition = "2024"
description = "EVE Online fitting tool: GPUI on top of the refine fitting engine"
# refine is AGPL, and efa links it.
license = "AGPL-3.0-or-later"
repository = "https://github.com/NicolasKion/efa"
publish = false

[dependencies]
# refine has no releases yet and its API moves fast, so it is pinned to a commit.
rc = { package = "refine-core", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530" }
redh = { package = "refine-edh", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530", features = ["phb-fs"] }
radc = { package = "refine-adc", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530", features = ["postcard-zfs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "rustls"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
gpui-kit = "0.9.0"
postcard = { version = "1", features = ["use-std"] }
# EVEMon character sheets and skill plans.
roxmltree = "0.21"
flate2 = "1"
# pyfa's market search: regex tokens and its jargon file, whose patterns use lookbehind.
fancy-regex = "0.16"
serde-saphyr = "1.3"
# EVE SSO: PKCE hashes, random state and RS256 checks on the access tokens. reqwest already
# builds aws-lc for its TLS.
aws-lc-rs = "1"
base64 = "0.22"
# Platform folders for user data and caches.
dirs = "6"
# The embedded data pack: zstd-compressed postcard, with its blobs as plain bytes.
zstd = "0.14"
serde_bytes = "0.11"
# The user's fits, characters, logins and settings. Bundled, so no platform needs SQLite installed.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
# Self-updates from the signed bundles each release carries (latest.json).
cargo-packager-updater = "0.2"

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "efa"
identifier = "com.nicolaskion.efa"
description = "EVE Online fitting tool"
homepage = "https://github.com/NicolasKion/efa"
category = "Utility"
before-packaging-command = "cargo build --release"
binaries = [{ path = "efa", main = true }]
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/efa.icns",
    "assets/icons/efa.ico",
]

[package.metadata.packager.macos]
# Ad-hoc signature: there is no Developer ID certificate, so Gatekeeper asks on first start.
signing-identity = "-"
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
# No admin prompt, which also lets the updater replace the install on its own.
installer-mode = "currentUser"
installer-icon = "assets/icons/efa.ico"

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0", "libvulkan1", "libfontconfig1"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
# Loading 150 MB of JSON and running the engine unoptimized is painfully slow.
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Stat math moves between f64, f32 for drawing, and counts; the values are small and known.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
# Application code: these add noise without catching anything here.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

# Submenu entries with a custom label (game icons next to ammo families) need a gpui-component
# change that is not released yet; it lives on the submenu-element branch of a local checkout. Absolute paths so
# git worktrees of efa find it too.
[patch.crates-io]
gpui-kit = { git = "https://github.com/NicolasKion/gpui-kit", rev = "e564753d1998c82f9eeb905aa3cbc0ec797e6a3a" }
gpui-component = { git = "https://github.com/NicolasKion/gpui-kit", rev = "e564753d1998c82f9eeb905aa3cbc0ec797e6a3a" }
gpui-base = { git = "https://github.com/NicolasKion/gpui-kit", rev = "e564753d1998c82f9eeb905aa3cbc0ec797e6a3a" }
gpui-component-macros = { git = "https://github.com/NicolasKion/gpui-kit", rev = "e564753d1998c82f9eeb905aa3cbc0ec797e6a3a" }
gpui-kit-assets = { git = "https://github.com/NicolasKion/gpui-kit", rev = "e564753d1998c82f9eeb905aa3cbc0ec797e6a3a" }
