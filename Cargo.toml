[package]
name = "gyfa"
version = "0.1.0"
edition = "2024"
description = "EVE Online fitting tool: GPUI on top of the refine fitting engine"
# refine is AGPL, and gyfa links it.
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# refine has no releases yet and its API moves fast, so it is pinned to a commit.
rc = { package = "refine-core", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530" }
redh = { package = "refine-edh", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530", features = ["phb-fs"] }
radc = { package = "refine-adc", git = "https://github.com/DarkFenX/refine", rev = "2f816366c1ef2a33cef7d18ecb142f5f2eb30530", features = ["postcard-zfs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "rustls"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
gpui-kit = "0.9.0"
postcard = { version = "1", features = ["use-std"] }
# EVEMon character sheets and skill plans.
roxmltree = "0.21"
flate2 = "1"
# pyfa's market search: regex tokens and its jargon file, whose patterns use lookbehind.
fancy-regex = "0.16"
serde-saphyr = "1.3"

[profile.dev.package."*"]
# Loading 150 MB of JSON and running the engine unoptimized is painfully slow.
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Stat math moves between f64, f32 for drawing, and counts; the values are small and known.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
# Application code: these add noise without catching anything here.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

# Submenu entries with a custom label (game icons next to ammo families) need a gpui-component
# change that is not released yet; it lives on the submenu-element branch of a local checkout. Absolute paths so
# git worktrees of gyfa find it too.
[patch.crates-io]
gpui-kit = { path = "/home/tim/Projects/rust/gpui-component/crates/kit" }
gpui-component = { path = "/home/tim/Projects/rust/gpui-component/crates/component" }
gpui-base = { path = "/home/tim/Projects/rust/gpui-component/crates/base" }
gpui-component-macros = { path = "/home/tim/Projects/rust/gpui-component/crates/component-macros" }
gpui-kit-assets = { path = "/home/tim/Projects/rust/gpui-component/crates/assets" }
